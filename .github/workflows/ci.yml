name: CI

# Each commit is tested once: pushes to main, and pull requests (which
# cover a branch's pushes once its PR is open; a branch without a PR gets
# no CI). Pushing to a branch with a PR used to run everything twice, once
# per trigger. Pushes to main only, not tags: a bare `push:` also fires on
# tags, so publishing a release re-ran CI on a commit that had already
# passed. Docs-only pushes to main (README, screenshots, licence, issue
# templates, the website in web/) can't break the app, so they skip CI.
# Pull requests always run it: main requires these checks to pass before a
# PR merges, and a skipped run would leave the PR waiting.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "public/**"
      - "web/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:

# A newer push to the same branch cancels the run it makes outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Caches Gradle and its downloads between runs (like caching node_modules).
      - uses: gradle/actions/setup-gradle@v4
      # Runs the unit tests and makes sure the APK still compiles.
      - run: ./gradlew test assembleDebug

  # End-to-end tests (app/src/androidTest): the real app on an emulator,
  # driven by UI Automator. Same suite as scripts/e2e.sh locally. Twice: on
  # Android 14 (like the test phone), on the Google Play image like
  # scripts/emulator.sh's, and on Android 16, the version the app targets,
  # where the system applies newer rules (screens drawn under the bars, the
  # new back handling) that Android 14 never does.
  e2e:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 34, target: google_apis_playstore, name: e2e-android-14 }
          - { api: 36, target: google_apis, name: e2e-android-16 }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Hardware acceleration: GitHub's Linux runners support KVM, but the
      # runner user needs access to the device.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A fresh emulator, cold-booted every run. No cached snapshot: every
      # run starts from the same clean device, with no state or clock jump
      # carried over from an earlier one. On the Google Play image, the Play
      # Store is switched off first: it auto-updates Google Play Services a
      # few minutes after boot, which freezes it mid-install and stalls apps
      # the tests open (once, "deskclock didn't open"). The tests don't use
      # it. Android 16's image has no Play Store, so there it does nothing.
      - name: Run the e2e tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            if adb shell pm list packages | grep -q com.android.vending; then adb shell pm disable-user --user 0 com.android.vending; fi
            ./gradlew connectedDebugAndroidTest
      # Which test failed and why (HTML report), plus a screenshot of the
      # screen at the moment each failing test failed and the device log.
      - name: Upload the e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
