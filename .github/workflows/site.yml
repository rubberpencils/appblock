name: Publish site

# Publishes appblock.robinroy.xyz on GitHub Pages: the pages in web/
# (privacy policy and the like) at the site root, and the signed
# Shorts-detection rules at /<format>/rules.signed.json (rules/v1/ in the
# repo is /v1/ there), where the app fetches them. It only publishes rules:
# signing happens on a key holder's machine (./gradlew signRules), so a
# push can't make rules the app accepts, only copy ones already signed.
# A Pages deploy replaces the whole site, so the pages and every rules
# format are published each time. On a push to main that touches either,
# and on demand (Actions > Publish site > Run workflow).
on:
  push:
    branches: [main]
    paths: ["web/**", "rules/**", ".github/workflows/site.yml"]
  workflow_dispatch:

# One deploy at a time, and a running one is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # FeedsTest checks the signed rules against the app's public key and
      # their rules.json: a file the app would throw away is never published.
      - run: ./gradlew testDebugUnitTest
      # web/ as is, then only the signed rules on top:
      # rules/v1/rules.signed.json -> site/v1/rules.signed.json.
      - name: Build the site
        run: |
          # /v1/, /v2/... belong to the rules: a page there would be
          # served next to them, or be overwritten by them.
          for d in rules/*/; do
            if [ -e "web/$(basename "$d")" ]; then
              echo "::error::web/$(basename "$d") clashes with the rules at /$(basename "$d")/"
              exit 1
            fi
          done
          # The Play Store listing links to the privacy policy.
          if [ ! -f web/privacy/index.html ]; then
            echo "::error::web/privacy/index.html is missing"
            exit 1
          fi
          cp -R web site
          for f in rules/*/rules.signed.json; do
            mkdir -p "site/$(basename "$(dirname "$f")")"
            cp "$f" "site/$(basename "$(dirname "$f")")/"
          done
          find site -type f
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
