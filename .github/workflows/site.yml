name: Publish site

# Publishes trymoly.com on Cloudflare (the Worker in server/): the pages in
# web/ (privacy policy and the like) at the site root, the signed
# Shorts-detection rules at /<format>/rules.signed.json (rules/v1/ in the
# repo is /v1/ there), where the app fetches them, and the API under /api/.
# It only publishes rules: signing happens on a key holder's machine
# (./gradlew signRules), so a push can't make rules the app accepts, only
# copy ones already signed. A deploy replaces the whole site, so the pages
# and every rules format are published each time. On a push to main that
# touches any of them, and on demand (Actions > Publish site > Run workflow).
on:
  push:
    branches: [main]
    paths: ["web/**", "rules/**", "server/**", ".github/workflows/site.yml"]
  workflow_dispatch:

# One deploy at a time, and a running one is never cut off halfway.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # FeedsTest checks the signed rules against the app's public key and
      # their rules.json: a file the app would throw away is never published.
      - run: ./gradlew testDebugUnitTest
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      # The server's own checks. Its site build refuses a page in web/ that
      # would sit on the rules' or the API's path, and a missing privacy
      # policy (the Play Store listing links to it).
      - run: pnpm check
        working-directory: server
      # Builds site/ from web/ and rules/ again, then uploads it with the
      # Worker. The token can edit Workers on this account and nothing else.
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
